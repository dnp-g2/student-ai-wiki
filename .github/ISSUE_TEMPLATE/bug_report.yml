name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Paste the exact command and output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `student-wiki doctor`
      description: Run it inside your vault. Remove anything private.
      render: text
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: AI tool
      options: [Claude Code CLI, OpenAI Codex CLI, Neither (command line only)]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
